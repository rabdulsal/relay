name: Relay
options:
  bundleIdPrefix: com.salaamsolutions
  deploymentTarget:
    # MenuBarExtra + .menuBarExtraStyle(.window) require macOS 13.0 minimum.
    # 13.0 maximises addressable installs; bump to 14.0 if you need any 14-only API.
    macOS: "13.0"
  xcodeVersion: "16"

targets:
  Relay:
    type: application
    platform: macOS
    sources:
      - Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salaamsolutions.relay
        MARKETING_VERSION: "1.0.0"
        # Build number is managed by Fastlane (increment_build_number).
        # Increment manually here only if not using Fastlane.
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableDescription: "External working memory for multi-agent systems"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM to your 10-digit Apple Team ID.
        # Find it at developer.apple.com → Account → Membership.
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        SWIFT_VERSION: "5.9"
    entitlements:
      path: Relay/Relay.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
